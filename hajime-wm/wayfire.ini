# Hajime desktop — wayfire configuration.
#
# wayfire rather than a compositor written from scratch: FreeBSD ships it as a
# binary package, it stacks windows the way a CRT-framed desktop needs, and its
# plugin system is where the scanline layer belongs. Writing one would have
# been months for the same picture.
#
# Install:
#   pkg install drm-kmod gpu-firmware-intel-kabylake seatd wayfire wf-shell
#   sysrc kld_list="i915kms"
#   sysrc seatd_enable="YES"
#
# The firmware package is the part people miss. Without it the driver loads but
# no display appears, and the failure reads as a driver problem.

[core]
# Only what the desktop needs. Every plugin costs memory on an 8 GB host, and
# the cube and wobbly-window plugins are decoration on decoration.
plugins = \
    autostart \
    command \
    decoration \
    expo \
    grid \
    move \
    place \
    resize \
    vswitch \
    window-rules

# One workspace row. A server desktop is opened to look at something, not to
# live in.
vwidth = 2
vheight = 1

background_color = 0.29 0.25 0.26 1.0
close_top_view = <super> KEY_Q

[autostart]
# The panel and the background, from wf-shell.
panel = wf-panel
background = wf-background

# The console is the point of the desktop: open it on login.
console = sh -c 'sleep 2; xdg-open http://127.0.0.1:8088/ || true'

[decoration]
# Window frames in the logo's palette: a warm wooden bezel around a cream
# screen, navy text. The theme that shipped with the original plan was cold
# cyan on near-black and clashed with the mascot it sat beside.
title_height = 26
border_size = 4
active_color    = 0.753 0.541 0.416 1.0
inactive_color  = 0.541 0.373 0.278 1.0
font = monospace 11

[place]
# New windows centred: with two workspaces and few windows, cascading only
# makes them harder to find.
mode = center

[grid]
# Halves and quarters by keyboard. The mouse is often not present on a server.
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_t = <super> KEY_UP
slot_b = <super> KEY_DOWN
slot_c = <super> KEY_ENTER

[expo]
toggle = <super> KEY_E

[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

[vswitch]
binding_left = <super> KEY_H
binding_right = <super> KEY_L

[command]
binding_terminal = <super> KEY_T
command_terminal = xterm

binding_console = <super> KEY_C
command_console = xdg-open http://127.0.0.1:8088/

[window-rules]
# The console opens maximised: it is a dashboard, not a document.
rule_console = on created if app_id contains "hajime" then maximize

[input]
# Arabic alongside English, toggled with both shifts. The taskbar and file
# manager are read in Arabic.
xkb_layout = us,ara
xkb_options = grp:shifts_toggle
