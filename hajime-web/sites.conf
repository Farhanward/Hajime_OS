# The sites this machine serves. One line each, and this file is the only place
# a site is declared.
#
# The Caddyfile is generated from this by generate_caddyfile.sh and must not be
# edited by hand: the next run overwrites it. Declaring a site in two places is
# how a domain ends up pointing at last year's directory.
#
#   <domain>  <kind>  <target>
#
#   static   target is a directory. Caddy serves the files in it.
#   php      target is a directory. Caddy serves it through php-fpm, which is
#            what the shop needs and the only reason PHP is installed at all.
#   proxy    target is host:port. Caddy passes the request to it unchanged.
#
# Lines starting with # are ignored, as are blank ones. Nothing else is.
#
# ---------------------------------------------------------------------------
# Why every site is plain HTTP here, and why that is not a mistake
#
# Cloudflare terminates TLS at its edge and cloudflared carries the request to
# this machine over the tunnel. Nothing reaches port 80 or 443 from the
# internet, which means Caddy cannot answer an ACME challenge and cannot get a
# certificate. Asking it to try produces a retry loop in the log and a site that
# is down while it retries. So the generator writes `http://` addresses and
# turns automatic HTTPS off, and the encryption a visitor sees is Cloudflare's.
#
# If this machine is ever exposed directly, that decision changes and the
# generator has to change with it.
# ---------------------------------------------------------------------------
# Where this table came from
#
# Read over SSH from the old server (192.168.100.59), 2026-08-09, read-only
# commands only. Three independent sources, in the order of trust below --
# where two disagreed, the more directly-enforced one won:
#
#   1. nginx-proxy-manager's own generated vhosts, read live off the running
#      container: /vault/docker/volumes/carbonflow-tech_npm_data/_data/nginx/
#      proxy_host/{1..5}.conf. This is nginx configuration nginx itself is
#      currently serving from -- the most direct evidence there is.
#   2. qood-caddy's Caddyfile, /opt/qood-proxy/Caddyfile, bind-mounted
#      read-only into a container running with --network host, so its
#      "127.0.0.1:8087" is the same loopback qood-orders publishes to
#      (`0.0.0.0:8087->8080/tcp` in `docker ps`). No inference involved.
#   3. /opt/carbonflow/compose/docker-compose.yml, whose `expose:` lines gave
#      the internal port for every carbonflow-* container and matched (1)
#      and (2) everywhere they overlapped.
#
# carbonflow-cloudflared runs `tunnel run --token ...` with no config mount
# (`docker inspect` shows empty Mounts), so its ingress rules live in
# Cloudflare's dashboard, not in a file this box could read. A local file at
# /opt/carbonflow/cloudflared/config.yml carries what look like the same
# rules and matches two of the domains below against env vars inside the
# still-running containers that call them (N8N_HOST, WEBHOOK_URL,
# UPTIME_KUMA_BASE_URL) -- used here as corroboration, never as the sole
# source for a row that isn't backed by (1), (2) or (3) too.
#
# Full sourcing per domain, and everything found but left out, is in
# hajime-web/README.md.
# ---------------------------------------------------------------------------

# LEFT OUT, decided, not deferred.
#
# nginx-proxy-manager proxy_host/4.conf sent this domain to 8088, which on the
# old server was carbonflow-control-panel: a separate application, up 4 weeks
# at read time. 8088 is also this machine's console default. The two are not
# the same program and the matching port is a coincidence, so leaving this out
# does not take away anything the old server offered.
#
# The console stays off the public internet. One rule at the ingress forwards
# everything here, so a row for it would put an administration interface on a
# public name with nothing in front of it. It binds to 127.0.0.1 by default
# and there are two ways in that do not involve the tunnel:
#
#   over the LAN         HAJIME_CONSOLE_BIND=192.168.100.59:8088, then
#                        http://192.168.100.59:8088
#   from anywhere        ssh -L 8088:127.0.0.1:8088 root@192.168.100.59
#                        then http://127.0.0.1:8088 on your own machine
#
# The second costs nothing and leaves the console reachable only by someone
# who already holds the ssh key. If it ever does need a public name, the row
# belongs behind Cloudflare Access rather than bare in this file.
#
# control-panel.carbonflows.store  proxy  127.0.0.1:8088

# nginx-proxy-manager proxy_host/2.conf; corroborated by
# /opt/carbonflow/cloudflared/config.yml and docker-compose.yml (3010).
# carbonflow-release-api was observed stopped (Exited, 5 days) at read time --
# the route is real, the upstream was not running.
# LEFT OUT: there is nothing on the other end, by an earlier decision.
#
# decisions.md, 2026-08-03: release-api and telemetry-api are dropped. They
# were measured at zero requests in thirty days, and /vault/products, which
# release-api served, holds no published file at all. Nothing working is
# lost by dropping them, and a row here would give a domain that answers 502.
#
# releases.carbonflows.store        proxy  127.0.0.1:3010

# LEFT OUT: it collides with byfatmalens.space below, which also wants 3000.
#
# nginx-proxy-manager proxy_host/3.conf, corroborated two other ways. On the
# old server these two never met: each container had 3000 to itself inside
# its own Docker network, and only nginx knew both. Here there is one
# loopback and one thing can hold a port.
#
# fatmalens keeps 3000 because it is the one that is running:
# carbonflow-telemetry-api is `Exited (137) 5 days ago` -- killed, not
# stopped cleanly -- while fatmalens-album is `Up 4 weeks`. That is evidence,
# not a preference. Give telemetry a free port when something is put back on
# it and this line can come back.
#
# telemetry.carbonflows.store       proxy  127.0.0.1:3000

# LEFT OUT: as written it makes Caddy dial itself.
#
# nginx-proxy-manager proxy_host/5.conf sends this to 80, which was
# carbonflow-litecart's *internal* container port, alone on its own Docker
# network. Here Caddy owns 80: it is the single thing the tunnel forwards
# everything to. A proxy row pointing at 127.0.0.1:80 is a loop, and a loop
# in the live table is worse than a missing site, because it takes the
# generator's output with it.
#
# The row was finished rather than dropped. LiteCart is PHP, so in this
# architecture it is not a proxy at all, and php-fpm is installed for exactly
# this. Its files were in a Docker named volume rather than a bind mount
# (carbonflow-tech_litecart_html at /var/www/html), and restore_data.sh now
# places them at /vault/litecart owned by www -- the name the old server had
# already reserved and left empty.
shop.carbonflows.store            php    /vault/litecart

# /opt/carbonflow/cloudflared/config.yml. Not read from a mount this box
# could prove is live (see the note above), but carbonflow-n8n's own
# N8N_HOST and WEBHOOK_URL env vars name this exact host, and
# docker-compose.yml exposes 5678 for it.
# 5678 is not a coincidence and not the old container: it is hajime_workflow
# in hajime-sys/src/service.rs, which kept n8n's port deliberately so this
# domain, the webhook URLs inside the workflows, and anything that calls them
# from outside all keep working without being edited. The engine reads n8n's
# own export format; all seventeen workflows in the backup parse.
n8n.carbonflows.store              proxy  127.0.0.1:5678

# /opt/carbonflow/cloudflared/config.yml, same caveat as n8n above.
# Corroborated by docker-compose.yml (3001) and by UPTIME_KUMA_BASE_URL /
# UPTIME_KUMA_STATUS_URL, which two other containers use to reach it.
# LEFT OUT twice over: nothing serves it, and 3001 belongs to something else.
#
# It was uptime-kuma, which has no home in the new system and no decision
# recorded either way -- it is in the gap list in
# hajime-migrate/INVENTORY_2026-08-03.md, not in the service table.
#
# And 3001 is hajime_wa_bridge in hajime-sys/src/service.rs. Enabling this row
# would not give a dead domain, it would quietly put the WhatsApp bridge on a
# public status page. When something is chosen to answer this name, give it a
# port the service table does not already claim.
#
# status.carbonflows.store           proxy  127.0.0.1:3001

# /opt/qood-proxy/Caddyfile, one server block, three names, all to the same
# reverse_proxy target. See source (2) above -- this is the most directly
# confirmed row in the table.
# LEFT OUT for now, and these three come back together.
#
# decisions.md, 2026-08-03: qood and fatmalens are pulled out as independent
# projects and returned after the system is installed, the same way the
# CarbonFlow site is. So at install time there is nothing listening on 8087
# and the rows would answer 502.
#
# They are written out in full because 8087 is free in
# hajime-sys/src/service.rs: when qood is put back on that port, uncomment
# these three lines and nothing else has to change.
#
# qood.store                         proxy  127.0.0.1:8087
# www.qood.store                     proxy  127.0.0.1:8087
# qood.carbonflows.store             proxy  127.0.0.1:8087

# /opt/fatmalens/docker-compose.fatmalens.yml, whose own header comment names
# this domain and which sets PORT=3000 explicitly (overriding the stale
# PORT=3001 in .env.example, which is not what the container actually runs
# with -- docker inspect's ExposedPorts confirms 3000). Served through its
# own dedicated Cloudflare tunnel (fatmalens-tunnel), unrelated to the
# carbonflows.store one.
# LEFT OUT for now, and it cannot come back on this port.
#
# Same decision as qood above: fatmalens is pulled out and returned after the
# system is installed. And 3000, which fatmalens-album used, is hajime_wa in
# hajime-sys/src/service.rs. So this is not a row to uncomment later -- it is
# a row to rewrite with whatever port fatmalens is given when it returns.
#
# This is also why telemetry.carbonflows.store above lost its argument for
# 3000: neither of them can have it.
#
# byfatmalens.space                  proxy  127.0.0.1:3000
